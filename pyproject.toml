[project]
name = "yt-mp3-ls"
version = "1.0.3"
description = "Modern YouTube downloader and converter for Windows using Python, CustomTkinter, and yt-dlp"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
